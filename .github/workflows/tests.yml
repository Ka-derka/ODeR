name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ubuntu Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q core gui main.py creator_main.py

      - name: Verify release metadata
        run: python tools/verify_release.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  windows-build:
    name: Windows installers
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify release metadata
        run: python tools/verify_release.py

      - name: Build ODeR installer payload
        run: python -m PyInstaller --noconfirm build.spec

      - name: Build Creator installer payload
        run: python -m PyInstaller --noconfirm creator.spec

      - name: Smoke-check Windows artifact
        shell: pwsh
        run: |
          $artifact = Resolve-Path "dist/ODeR.exe"
          $expected = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $actual = (Get-Item -LiteralPath $artifact).VersionInfo.ProductVersion
          if ($actual -ne $expected) {
            throw "ODeR ProductVersion $actual does not match $expected"
          }
          if ((Get-Item -LiteralPath $artifact).Length -lt 1MB) {
            throw "ODeR installer payload is unexpectedly small"
          }
          $creatorArtifact = Resolve-Path "dist/ODeR Creator.exe"
          $creatorExpected = python -c "from core.version import CREATOR_VERSION; print(CREATOR_VERSION)"
          $creatorActual = (Get-Item -LiteralPath $creatorArtifact).VersionInfo.ProductVersion
          if ($creatorActual -ne $creatorExpected) {
            throw "Creator ProductVersion $creatorActual does not match $creatorExpected"
          }
          if ((Get-Item -LiteralPath $creatorArtifact).Length -lt 1MB) {
            throw "Creator executable is unexpectedly small"
          }

      - name: Launch Windows payloads
        shell: pwsh
        run: |
          $oder = Start-Process -FilePath (Resolve-Path "dist/ODeR.exe").Path -ArgumentList "--smoke-test" -Wait -PassThru -WindowStyle Hidden
          if ($oder.ExitCode -ne 0) { throw "ODeR smoke test failed" }
          $creator = Start-Process -FilePath (Resolve-Path "dist/ODeR Creator.exe").Path -ArgumentList "--smoke-test" -Wait -PassThru -WindowStyle Hidden
          if ($creator.ExitCode -ne 0) { throw "Creator smoke test failed" }

      - name: Build Windows installers
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler was not found" }
          & $compiler installer.iss
          & $compiler creator_installer.iss
          $assets = Get-ChildItem -LiteralPath release-dist -Filter "*.exe" | Sort-Object Name
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content -LiteralPath release-dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ODeR-Windows-installers-${{ github.sha }}
          path: |
            release-dist/ODeR Installer.exe
            release-dist/ODeR Creator Installer.exe
            release-dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  macos-build:
    name: macOS applications
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application bundles and disk images
        run: ./build_macos.sh

      - name: Verify bundle metadata
        run: |
          test -x "dist/ODeR.app/Contents/MacOS/ODeR"
          test -x "dist/ODeR Creator.app/Contents/MacOS/ODeR Creator"
          plutil -lint "dist/ODeR.app/Contents/Info.plist"
          plutil -lint "dist/ODeR Creator.app/Contents/Info.plist"

      - name: Launch macOS bundles
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/ODeR.app/Contents/MacOS/ODeR" --smoke-test
          "dist/ODeR Creator.app/Contents/MacOS/ODeR Creator" --smoke-test

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ODeR-macOS-${{ github.sha }}
          path: |
            release-dist/ODeR.dmg
            release-dist/ODeR Creator.dmg
            release-dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
