name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q core gui main.py

      - name: Verify release metadata
        run: python tools/verify_release.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-build:
    name: Windows portable build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify release metadata
        run: python tools/verify_release.py

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm build.spec

      - name: Smoke-check Windows artifact
        shell: pwsh
        run: |
          $artifact = Resolve-Path "dist/ODeR-Portable.exe"
          $expected = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $actual = (Get-Item -LiteralPath $artifact).VersionInfo.ProductVersion
          if ($actual -ne $expected) {
            throw "Portable ProductVersion $actual does not match $expected"
          }
          if ((Get-Item -LiteralPath $artifact).Length -lt 1MB) {
            throw "Portable executable is unexpectedly small"
          }

      - name: Upload portable smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: ODeR-Windows-smoke-${{ github.sha }}
          path: dist/ODeR-Portable.exe
          if-no-files-found: error
          retention-days: 7
