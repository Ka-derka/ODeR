name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ODeR. Remove private URLs, cached data, credentials, and downloaded content before attaching logs or screenshots.

  - type: input
    id: version
    attributes:
      label: ODeR version
      placeholder: 0.15.2
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Running from source
        - Portable executable
        - Windows installer
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows version, Python version, and PySide6 version when relevant.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots here. Use a private security advisory for vulnerabilities.
